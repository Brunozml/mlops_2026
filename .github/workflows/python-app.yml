# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        project: [mnist, s1_intro, s2_vc, s3_repr, s5_ci]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v1
      - name: "${{ matrix.project }} - Install dependencies using uv"
        run: |
          cd ${{ matrix.project }}
          uv sync
      - name: "${{ matrix.project }} - Test with pytest"
        run: |
          cd ${{ matrix.project }}
          pytest
      - name: "${{ matrix.project }} - Lint code with Ruff"
        run: |
          cd ${{ matrix.project }}
          uv run ruff check --output-format=github
      - name: "${{ matrix.project }} - Check code formatting with Ruff"
        run: |
          cd ${{ matrix.project }}
          uv run ruff format --diff
        continue-on-error: true
